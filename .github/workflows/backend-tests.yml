name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - gestionclinica
          - gestionsoporte
          - bff-rednote
          - api-gateway

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar tests en ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn test