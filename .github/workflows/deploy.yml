name: Deploy RedNorte to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/rednorte-key.pem
          chmod 600 ~/.ssh/rednorte-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy project on EC2
        run: |
          ssh -i ~/.ssh/rednorte-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ec2-user/proyecto-rednorte

            echo "Actualizando código desde GitHub..."
            git pull origin main

            echo "Construyendo Eureka Server..."
            docker compose build eureka-server

            echo "Construyendo Gestión Clínica..."
            docker compose build gestionclinica

            echo "Construyendo Gestión Soporte..."
            docker compose build gestionsoporte

            echo "Construyendo BFF..."
            docker compose build bff

            echo "Construyendo API Gateway..."
            docker compose build api-gateway

            echo "Construyendo Frontend..."
            docker compose build frontend

            echo "Levantando contenedores..."
            docker compose up -d --no-build

            echo "Estado final de contenedores:"
            docker ps
          EOF